services:
  music-engine:
    build: .
    ports:
      - "8000:8000"
    environment:
      - MUSIC_MODEL=${MUSIC_MODEL:-ace-step}
      # El MISMO secreto que GENERATOR_CALLBACK_SECRET en Next.js (Vercel).
      - GENERATOR_CALLBACK_SECRET=${GENERATOR_CALLBACK_SECRET:?}
      # URL pública de ESTE engine (sin barra final) para el audioUrl del callback.
      - ENGINE_PUBLIC_URL=${ENGINE_PUBLIC_URL:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
