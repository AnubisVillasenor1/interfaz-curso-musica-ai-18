name: Preview readiness

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    name: Typecheck, production build and route smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Deliberately unconfigured: CI verifies the safe public fallback and
      # must never need or receive production credentials.
      NEXT_PUBLIC_APP_URL: https://example.invalid
      NEXT_PUBLIC_SUPABASE_URL: ""
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ""
      SUPABASE_SERVICE_ROLE_KEY: ""
      STRIPE_SECRET_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
      GENERATOR_CALLBACK_SECRET: ""
      API_KEY: ""
      AI_AGENT_API_KEY: ""
      VERCEL_ANALYTICS_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false

      - name: Install from frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: TypeScript validation
        run: pnpm typecheck

      - name: Production build
        run: pnpm build

      - name: Start production server
        shell: bash
        run: |
          pnpm start > /tmp/play-go-next.log 2>&1 &
          echo $! > /tmp/play-go-next.pid
          for attempt in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:3000/ > /dev/null; then
              echo "Next.js production server is ready."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/play-go-next.log
          echo "Next.js production server did not become ready." >&2
          exit 1

      - name: Route smoke tests
        run: node scripts/smoke-preview.mjs

      - name: Upload server log if a step fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: next-production-server-log
          path: /tmp/play-go-next.log
          if-no-files-found: ignore
