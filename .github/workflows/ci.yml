name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, production build and functional smoke checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # No production secrets are passed to CI. The smoke suite verifies safe
    # no-credential behavior and local deterministic fallbacks.
    env:
      NEXT_PUBLIC_SUPABASE_URL: ""
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ""
      SUPABASE_SERVICE_ROLE_KEY: ""
      STRIPE_SECRET_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
      GENERATOR_CALLBACK_SECRET: ""
      AI_AGENT_API_KEY: ""
      FREEAI_API_KEY: ""
      BAZAARLINK_API_KEY: ""
      OLLAMA_BASE_URL: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install from frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: TypeScript validation
        run: pnpm typecheck

      - name: Rate limit policy and memory store tests
        run: node --test scripts/test-rate-limit.mjs

      - name: Callback signature expiration and nonce tests
        run: node --test scripts/test-callback-signature.mjs

      - name: Audio upload container detection tests
        run: node --test scripts/test-audio-file-signature.mjs

      - name: Verify callback replay protection contracts
        run: node scripts/verify-callback-security.mjs

      - name: Verify authentication and per-user isolation contracts
        run: node scripts/verify-auth-isolation.mjs

      - name: Production build
        run: pnpm build

      - name: Start production server
        shell: bash
        run: |
          pnpm start > /tmp/play-go-next.log 2>&1 &
          echo $! > /tmp/play-go-next.pid
          for attempt in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:3000/ > /dev/null; then
              echo "Next.js production server is ready."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/play-go-next.log
          echo "Next.js production server did not become ready." >&2
          exit 1

      - name: Route and API smoke tests
        run: node scripts/smoke-preview.mjs

      - name: Rate limit HTTP regression (429, headers and recovered endpoints)
        run: node scripts/test-rate-limit-http.mjs

      - name: Operational health endpoint
        run: |
          curl --silent --fail http://127.0.0.1:3000/api/health > /tmp/play-go-health.json
          node -e "
            const health = require('/tmp/play-go-health.json');
            if (health.ok !== true) throw new Error('health.ok is not true');
            if (health.rateLimit.mode !== 'memory') {
              throw new Error('CI must run with the in-memory limiter, got ' + health.rateLimit.mode);
            }
            if (health.checks.stripe || health.checks.supabaseAdmin) {
              throw new Error('CI must not report configured production credentials');
            }
            console.log('Health endpoint OK:', JSON.stringify(health.rateLimit));
          "

      - name: Verify entitlement lifecycle contracts
        run: node scripts/verify-entitlement-lifecycle.mjs

      - name: Verify exam and certificate security
        run: node scripts/verify-exam-security.mjs

      - name: Verify cinematic presentation alignment
        run: node scripts/verify-cinematic-presentation.mjs

      - name: Verify TAMV-AudioCore browser/native contracts
        run: node scripts/verify-audio-core.mjs

      - name: Verify advanced audio curriculum contracts
        run: node scripts/verify-advanced-audio-curriculum.mjs

      - name: Verify Module 3 capstone contracts
        run: node scripts/verify-module-3-project.mjs

      - name: Upload server log if a step fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: next-production-server-log
          path: /tmp/play-go-next.log
          if-no-files-found: ignore


  audio-lab:
    name: Python audio lab tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: laboratorio-audio-ia/requirements.txt

      - name: Install audio-analysis dependencies
        working-directory: laboratorio-audio-ia
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install MIDI dependency for Module 3 tests
        working-directory: laboratorio-audio-ia
        run: python -m pip install pretty-midi==0.2.11

      - name: Compile Python source and tests
        working-directory: laboratorio-audio-ia
        run: python -m compileall -q src tests

      - name: Run tests with synthetic audio
        working-directory: laboratorio-audio-ia
        run: python -m unittest discover -s tests -v

      - name: Compile Module 3 Python toolkit
        working-directory: laboratorio-audio-ia
        run: python -m compileall -q modulo_3_ia/src modulo_3_ia/tests

      - name: Run Module 3 tests
        working-directory: laboratorio-audio-ia
        run: python -m unittest discover -s modulo_3_ia/tests -v

  audiocore-service:
    name: TAMV-AudioCore service tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/audiocore
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/audiocore/requirements.txt

      - name: Install service dependencies
        run: python -m pip install -r requirements.txt

      - name: Run AudioCore service tests
        run: python -m unittest discover -s tests -v

  native-core:
    name: Native C++ audio core build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure scalar build
        run: cmake -S native/tamv-audiocore -B build/native -DCMAKE_BUILD_TYPE=Release

      - name: Build native core and contract tests
        run: cmake --build build/native --parallel 2

      - name: Run native contract tests
        run: ctest --test-dir build/native --output-on-failure

  audiocore-image:
    name: TAMV-AudioCore reference image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build NumPy reference image
        run: docker build -f services/audiocore/Dockerfile -t tamv-audiocore:ci .


  musicgen-queue:
    name: Async MusicGen gateway validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install isolated gateway dependencies
        working-directory: services/gateway-worker
        run: npm install --omit=dev --no-audit --no-fund

      - name: Validate gateway JavaScript syntax
        run: node --check services/gateway-worker/src/server.mjs

      - name: Validate Python service syntax
        run: python -m py_compile services/audiocore/musicgen_service.py services/voice-identity/service.py

      - name: Validate Compose configuration
        working-directory: ops/audio-core
        run: docker compose --env-file .env.example -f docker-compose.yml config --quiet

