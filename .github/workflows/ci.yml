name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, production build and functional smoke checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # No production secrets are passed to CI. The smoke suite verifies safe
    # no-credential behavior and local deterministic fallbacks.
    env:
      NEXT_PUBLIC_SUPABASE_URL: ""
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ""
      SUPABASE_SERVICE_ROLE_KEY: ""
      STRIPE_SECRET_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
      GENERATOR_CALLBACK_SECRET: ""
      AI_AGENT_API_KEY: ""
      FREEAI_API_KEY: ""
      BAZAARLINK_API_KEY: ""
      OLLAMA_BASE_URL: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install from frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: TypeScript validation
        run: pnpm typecheck

      - name: Production build
        run: pnpm build

      - name: Start production server
        shell: bash
        run: |
          pnpm start > /tmp/play-go-next.log 2>&1 &
          echo $! > /tmp/play-go-next.pid
          for attempt in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:3000/ > /dev/null; then
              echo "Next.js production server is ready."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/play-go-next.log
          echo "Next.js production server did not become ready." >&2
          exit 1

      - name: Route and API smoke tests
        run: node scripts/smoke-preview.mjs

      - name: Verify entitlement lifecycle contracts
        run: node scripts/verify-entitlement-lifecycle.mjs

      - name: Verify exam and certificate security
        run: node scripts/verify-exam-security.mjs

      - name: Verify cinematic presentation alignment
        run: node scripts/verify-cinematic-presentation.mjs

      - name: Verify advanced audio curriculum contracts
        run: node scripts/verify-advanced-audio-curriculum.mjs

      - name: Verify Module 3 capstone contracts
        run: node scripts/verify-module-3-project.mjs

      - name: Upload server log if a step fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: next-production-server-log
          path: /tmp/play-go-next.log
          if-no-files-found: ignore


  audio-lab:
    name: Python audio lab tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: laboratorio-audio-ia/requirements.txt

      - name: Install audio-analysis dependencies
        working-directory: laboratorio-audio-ia
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install MIDI dependency for Module 3 tests
        working-directory: laboratorio-audio-ia
        run: python -m pip install pretty-midi==0.2.11

      - name: Compile Python source and tests
        working-directory: laboratorio-audio-ia
        run: python -m compileall -q src tests

      - name: Run tests with synthetic audio
        working-directory: laboratorio-audio-ia
        run: python -m unittest discover -s tests -v

      - name: Compile Module 3 Python toolkit
        working-directory: laboratorio-audio-ia
        run: python -m compileall -q modulo_3_ia/src modulo_3_ia/tests

      - name: Run Module 3 tests
        working-directory: laboratorio-audio-ia
        run: python -m unittest discover -s modulo_3_ia/tests -v
