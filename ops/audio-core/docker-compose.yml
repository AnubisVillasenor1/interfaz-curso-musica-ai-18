name: play-and-go-audio
services:
  redis:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [audio-internal]

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes: ["minio_data:/data"]
    ports: ["127.0.0.1:9001:9001"]
    networks: [audio-internal]

  musicgen:
    build:
      context: ../..
      dockerfile: services/audiocore/Dockerfile.musicgen
    restart: unless-stopped
    environment:
      AUDIOCORE_INTERNAL_TOKEN: ${AUDIOCORE_INTERNAL_TOKEN:?Set AUDIOCORE_INTERNAL_TOKEN}
      MUSICGEN_MODEL: ${MUSICGEN_MODEL:-facebook/musicgen-small}
      MUSICGEN_MAX_DURATION_SECONDS: ${MUSICGEN_MAX_DURATION_SECONDS:-30}
      HF_HOME: /models/huggingface
    volumes: ["model_cache:/models"]
    expose: ["8001", "9102"]
    networks: [audio-internal]

  gateway-worker:
    build:
      context: ../..
      dockerfile: services/gateway-worker/Dockerfile
    restart: unless-stopped
    depends_on:
      redis: { condition: service_healthy }
      musicgen: { condition: service_started }
      minio: { condition: service_started }
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      GATEWAY_PORT: "8080"
      METRICS_PORT: "9101"
      GATEWAY_INTERNAL_TOKEN: ${GATEWAY_INTERNAL_TOKEN:?Set GATEWAY_INTERNAL_TOKEN}
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Set SUPABASE_SERVICE_ROLE_KEY}
      AUDIOCORE_URL: http://musicgen:8001
      AUDIOCORE_INTERNAL_TOKEN: ${AUDIOCORE_INTERNAL_TOKEN:?Set AUDIOCORE_INTERNAL_TOKEN}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Create a least-privilege MinIO worker user}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Create a least-privilege MinIO worker user}
      S3_BUCKET: ${S3_BUCKET:-tamv-audio}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      WORKER_MAX_JOBS_PER_MINUTE: ${WORKER_MAX_JOBS_PER_MINUTE:-6}
    expose: ["8080", "9101"]
    networks: [audio-internal]

  prometheus:
    image: prom/prometheus:v3.3.0
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    depends_on: [gateway-worker]
    networks: [audio-internal]

  grafana:
    image: grafana/grafana:11.6.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes: ["grafana_data:/var/lib/grafana"]
    ports: ["127.0.0.1:3001:3000"]
    depends_on: [prometheus]
    networks: [audio-internal]

volumes:
  redis_data:
  minio_data:
  model_cache:
  prometheus_data:
  grafana_data:

networks:
  audio-internal:
    driver: bridge
