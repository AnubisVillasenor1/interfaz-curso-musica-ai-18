# API interna de "Play and Go" (repo interfaz-curso-musica-ai-18).
# Generado por auditoría: cada campo, error y cabecera descritos aquí fueron
# leídos del código de los 12 route handlers. Donde el código no garantiza algo
# se marca con x-no-verificado: true en lugar de inventarlo.
#
# ADVERTENCIA DE DERIVA: los "(línea NN)" de los comentarios entre # apuntan a
# la revisión en la que se hizo la lectura. Tras aplicar los códigos de error y
# las cabeceras Cache-Control el desplazamiento es real, así que la referencia
# fiable es el nombre de la ruta, no el número. La versión 0.2.0 documenta el
# estado ya corregido; lo que sigue sin verificarse sigue marcando x-no-verificado.
#
# EXCLUCION deliberada: app/api/stripe/webhook/route.ts (POST /api/stripe/webhook)
# no se documenta como superficie pública porque solo debe recibir a Stripe:
# exige la cabecera stripe-signature verificada con STRIPE_WEBHOOK_SECRET,
# procesa checkout.session.completed / checkout.session.async_payment_succeeded /
# customer.subscription.deleted / invoice.payment_failed, y responde 503
# {error} si no está configurado, 400 si falta o es inválida la firma,
# 200 {received:true, duplicate:true} en eventos repetidos y 500 a propósito
# para forzar reintentos cuando la entrega falla (evidencia:
# app/api/stripe/webhook/route.ts:29-64, 95, 104, 118, 143).
openapi: 3.1.0
info:
  title: Play and Go — API interna del curso de música con IA
  version: 0.2.0
  description: |
    Capa HTTP interna de la app Next.js (App Router, runtime nodejs) que da
    servicio al curso "Play and Go by TAMV ONLINE": generación musical con dos
    motores (local en el navegador y proveedor de pago con voces), catálogo de
    dominio público, cuota por plan, cobro con Stripe y chat del curso.

    Regla de negocio del producto (verificada contra el código): cada respuesta
    de generación informa su procedencia. /api/generate etiqueta engine
    'local' o 'provider' en la canción y en el bloque render; /api/agent
    etiqueta source 'llm' o 'fallback' y nunca finge IA. La CUOTA RESTANTE se
    devuelve en el rechazo 402 de /api/generate ({limit, used}) y también en
    el éxito ({quota: {limit, used}}), de modo que un agente ya no necesita
    una segunda llamada a /api/entitlement para saber cuánto le queda.
    /api/entitlement sigue siendo la fuente completa del plan. Los endpoints
    que consumen cuota (/api/music/compose) siguen sin exigir sesión ni
    informar límite: no descuentan cupo, solo componen MIDI local.

    Autenticación: sesión de Supabase en cookies de servidor (@supabase/ssr,
    supabase.auth.getUser()). No hay esquema Bearer ni claves de API para
    consumidores de terceros.
  termsOfService: https://tamvonline-weboficial.com
  contact:
    name: TAMV ONLINE
    url: https://tamvonline-weboficial.com
    x-no-verificado: true # No existe email de soporte en el repo (package.json: "private": true, sin LICENSE).
  license:
    name: Propietaria — sin licencia publicada
    x-no-verificado: true # package.json:15 "private": true; no hay fichero LICENSE en el repo.
externalDocs:
  description: Auditoría técnica y registro de fallos de despliegue del propio repo
  url: https://github.com (docs/TECHNICAL_AUDIT.md y docs/DEPLOY_FAILURES.md en este repo)
servers:
  - url: https://interfaz-curso-musica-ai.vercel.app
    description: Producción en Vercel
tags:
  - name: music
    description: Compositor MIDI local y búsqueda en catálogos abiertos
  - name: generation
    description: Ciclo de creación de canciones (reserva de cuota, motores, callback)
  - name: library
    description: Biblioteca privada del usuario
  - name: billing
    description: Inicio de cobro con Stripe
  - name: account
    description: Plan, cupo, sesión
  - name: course
    description: Progreso del curso y chat guía
security: [] # Casi todas las rutas son públicas o declaran su security propia.

paths:
  /api/music/compose:
    post:
      operationId: compose_midi
      tags: [music]
      summary: Composición MIDI local desde una idea textual
      description: |
        Construye un plan musical determinista en el servidor (createLocalPlan)
        y devuelve el archivo MIDI como descarga. NO requiere sesión y NO
        descuenta ni informa cuota. El prompt solo parametriza el plan local;
        no hay proveedor externo en esta ruta.
        (evidencia: app/api/music/compose/route.ts:7-25)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt:
                  type: string
                  minLength: 1
                  maxLength: 1200
                  description: Idea musical. Se rechaza vacía (400) y >1200 caracteres (413).
                tempo:
                  type: integer
                  minimum: 50
                  maximum: 180
                  description: Entero fuera de rango o no-numérico se ignora silenciosamente y se usa el tempo del plan local (createLocalPlan) como default efectivo.
                  examples: [92]
                key:
                  type: string
                  pattern: '^[A-G](?:#|b)?\s*(?:major|minor)$'
                  description: Ignorada si no casa el patrón (regex /i); se usa la tonalidad del plan local.
                  examples: ["F# minor"]
            examples:
              compose_basic:
                value: { prompt: "bossa suave con batería lo-fi", tempo: 92, key: "F# minor" }
      responses:
        '200':
          description: MIDI generado como descarga.
          headers:
            Content-Type:
              schema: { type: string, const: audio/midi }
            Content-Disposition:
              schema: { type: string }
              description: 'attachment; filename="<slug>.mid" — slug derivado del título del plan local.'
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            audio/midi:
              schema: { type: string, contentEncoding: binary }
        '400':
          $ref: '#/components/responses/ErrorText' # { error: 'Escribe una idea musical.' } (línea 10)
        '413':
          $ref: '#/components/responses/ErrorText' # { error: 'La idea no puede superar 1.200 caracteres.' } (línea 11)

  /api/music/search:
    get:
      operationId: search_music_catalog
      tags: [music]
      summary: Búsqueda agregada en Internet Archive y Jamendo
      description: |
        Ruta pública sin sesión. Consulta ambos catálogos en paralelo con
        timeout de 7s y caché server-side de 1h en el fetch de upstream
        (next.revalidate:3600). La respuesta propia fija
        `public, max-age=60, stale-while-revalidate=300`: no depende de la
        sesión y un caché corto además protege a Internet Archive de golpes
        repetidos.
        Si un catálogo cae, se degrada en silencio y se informa por flags en
        providers. Solo 502 cuando ambos fallan. Jamendo devuelve 0 resultados
        si JAMENDO_CLIENT_ID no está configurado (se ignora, sin error).
        (evidencia: app/api/music/search/route.ts)
      security: []
      parameters:
        - name: q
          in: query
          required: true
          description: Consulta de búsqueda, 2-100 caracteres tras trim.
          schema: { type: string, minLength: 2, maxLength: 100 }
          examples: { example_basic: { value: 'piano ambiental' } }
      responses:
        '200':
          description: Resultados agregados y bandera de disponibilidad por proveedor.
          headers:
            Cache-Control:
              schema: { type: string, const: 'public, max-age=60, stale-while-revalidate=300' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResults' }
              examples:
                ok:
                  value:
                    results:
                      - id: ia-1234
                        title: Piano Sessions
                        creator: Internet Archive
                        source: Internet Archive
                        license: https://creativecommons.org/publicdomain/mark/1.0/
                        url: https://archive.org/details/1234
                    providers: { internetArchive: true, jamendo: false }
                    notice: Verifica los términos y la licencia de cada obra antes de usarla en proyectos públicos o comerciales.
        '400':
          $ref: '#/components/responses/ErrorText' # 'La búsqueda debe tener al menos 2 caracteres.' / '...no puede superar 100 caracteres.' (líneas 43-44)
        '502':
          $ref: '#/components/responses/ErrorText' # { error: 'Los catálogos no están disponibles en este momento.' } solo si ambos catálogos fallan (línea 52)

  /api/checkout:
    post:
      operationId: create_checkout_session
      tags: [billing]
      summary: Inicia una Session de cobro Stripe para un producto del catálogo
      description: |
        Requiere sesión Supabase con email verificado en la cookie. El email del
        comprador se lee de la sesión, NUNCA del cuerpo. Idempotencia real de 1
        minuto por usuario y producto (idempotencyKey 'pg:<userId>:<productId>:<minuto>').
        Errores de Stripe se quedan en el log del servidor; el cliente recibe
        frase genérica 502. (evidencia: app/api/checkout/route.ts:26-111)
      security:
        - SupabaseSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                productId:
                  $ref: '#/components/schemas/ProductId'
            examples:
              buy_course: { value: { productId: play-and-go-course } }
      responses:
        '200':
          description: URL de redirección a Stripe Checkout.
          content:
            application/json:
              schema:
                type: object
                required: [url, sessionId]
                properties:
                  url: { type: string, format: uri, description: URL de Stripe Checkout. }
                  sessionId: { type: string, description: 'cs_... de la Session creada.' }
              examples:
                ok: { value: { url: 'https://checkout.stripe.com/c/pay/cs_test_a1B2', sessionId: 'cs_test_a1B2C3' } }
        '400':
          description: Producto no válido. Único 4xx del repo con datos de recuperación (lista blanca disponible).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                bad_product: { value: { error: 'Producto no válido.', available: ['play-and-go-course', 'play-and-go-extension', 'play-and-go-pro'] } }
        '401':
          $ref: '#/components/responses/ErrorText' # { error: 'Inicia sesión para inscribirte.' } (línea 34)
        '503':
          description: Sin Supabase configurado, sin STRIPE_SECRET_KEY, o sin NEXT_PUBLIC_APP_URL (envuelta como {error:...}).
          $ref: '#/components/responses/ErrorText'
        '502':
          description: Stripe no devolvió URL o rechazó la sesión (frase genérica, sin detalle interno).
          $ref: '#/components/responses/ErrorText'

  /api/generate:
    post:
      operationId: create_generation
      tags: [generation]
      summary: Crea una canción reservando cuota atómica; motor local o proveedor
      description: |
        Requiere sesión. La reserva de cuota la hace la RPC
        consume_generation_quota (security definer, FOR UPDATE) y se devuelve
        (refund_generation_quota) si la fila, el proveedor o la config fallan.
        PROCEDENCIA: la respuesta siempre etiqueta el motor (song.engine y, en
        local, render.engine). CUOTA RESTANTE: solo se informa en el 402
        ({limit, used}); en 200 hay que volver a /api/entitlement (laguna de
        la regla de negocio, documentada en info.description).
        En modo provider la ruta es asincrónica: 200 con status 'queued' o
        'generating' + taskId; el audio llega después por /api/generate/callback.
        (evidencia: app/api/generate/route.ts:52-213)
      security:
        - SupabaseSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, prompt]
              properties:
                title: { type: string, minLength: 1, maxLength: 80, description: Se recorta a 80; vacío tras trim = 400. }
                prompt: { type: string, minLength: 1, maxLength: 2000, description: Se recorta a 2000; vacío = 400. }
                engine:
                  type: string
                  enum: [local, provider]
                  default: local
                  description: Cualquier valor distinto de 'provider' se trata como 'local' (coerción, no error).
                genre: { type: string, maxLength: 60, description: Opcional; null si vacío. }
                lyrics: { type: string, maxLength: 4000 }
                tempo: { type: integer, minimum: 40, maximum: 200, description: clamp(40,200); no numérico ⇒ null. }
                vocalStyle: { type: string, maxLength: 120 }
                instrumentation: { type: string, maxLength: 240 }
                lessonId: { type: string, maxLength: 64 }
                genreId: { type: string, maxLength: 40, description: Solo se reenvía al render local; ausente ⇒ undefined (omitido). }
                instrumental: { type: boolean, default: false, description: Solo afecta la llamada al proveedor. }
            examples:
              local: { value: { title: 'Lluvia en CDMX', prompt: 'jazz nocturno, piano suave, 88 bpm', engine: local, tempo: 88 } }
              provider: { value: { title: 'Corazón de reggaetón', prompt: 'corro con voces', engine: provider, lyrics: '...', vocalStyle: 'femenina, registro medio' } }
      responses:
        '200':
          description: >
            Canción creada. Con engine=local devuelve la RECETA (el audio lo
            renderiza el navegador y se sube por /api/songs/complete). Con
            engine=provider devuelve song en estado queued/generating + taskId.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/LocalRenderReply' }
                  - { $ref: '#/components/schemas/ProviderQueuedReply' }
              examples:
                local:
                  value:
                    song: { id: '0f12ab34-5678-4c9d-be0f-1a2b3c4d5e6f', title: 'Lluvia en CDMX', status: queued, created_at: '2026-11-21T18:04:00.000Z', engine: local }
                    render:
                      engine: local
                      prompt: 'jazz nocturno, piano suave, 88 bpm'
                      seed: 'play-and-go-local-v1:0f12ab34-5678-4c9d-be0f-1a2b3c4d5e6f'
                      bpm: 88
                      title: 'Lluvia en CDMX'
                    message: Receta lista. El navegador renderiza y guarda tu canción.
                    quota: { limit: 10, used: 3 }
                provider:
                  value:
                    song: { id: '0f12ab34-...', title: 'Corazón de reggaetón', status: queued, created_at: '2026-11-21T18:04:00.000Z', engine: provider }
                    taskId: 'task_9f8e7d'
                    quota: { limit: 3, used: 1 }
                    x-no-verificado: true # el paso queued→generating ocurre tras la update posterior; la respuesta puede capturar status 'queued'.
        '400':
          $ref: '#/components/responses/ErrorText' # { error: 'Completa el título y la dirección musical.' } (línea 67)
        '401':
          $ref: '#/components/responses/ErrorText' # { error: 'Inicia sesión para crear música.' } (línea 60)
        '402':
          description: Cupo agotado. limit/used llegan desde la RPC; el éxito de /api/generate repite el bloque como quota.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                quota: { value: { error: 'Sin cupo disponible.', code: quota_exceeded, limit: 10, used: 10 } }
        '500':
          $ref: '#/components/responses/ErrorText' # inserción de songs falló; cuota devuelta (líneas 114-121)
        '502':
          $ref: '#/components/responses/ErrorText' # proveedor no respondió; proyecto queda guardado en error, cuota devuelta (líneas 202-212)
        '503':
          description: >
            Cuatro causas, todas {error:...} y la primera además {song, fallback:'local'}:
            RPC de cuota falló; API_KEY de proveedor ausente (líneas 141-155);
            falta NEXT_PUBLIC_APP_URL (158-162); falta GENERATOR_CALLBACK_SECRET (164-169).
            En las tres de proveedor, el cupo se devuelve.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                provider_unconfigured:
                  value:
                    song: { id: '0f12ab34-...', title: 'x', status: queued, created_at: '2026-11-21T18:04:00.000Z', engine: provider }
                    error: 'El estudio con voces no está disponible ahora. Puedes crear con el motor local gratis.'
                    fallback: local

  /api/generate/callback:
    post:
      operationId: receive_generation_callback
      tags: [generation]
      summary: Retorno firmado del proveedor de generación (solo servidor a servidor)
      description: |
        La autenticación NO es sesión: es un HMAC-SHA256 del songId con el
        secreto GENERATOR_CALLBACK_SECRET, pasado como query param `sig`
        (lib/callback-signature.ts:43-61). Sin secreto configurado toda firma
        se rechaza con 401. El endpoint escribe via service_role RPC
        apply_generation_result. Un fallo de BD devuelve 500 para que el
        proveedor reintente. Estados 'pending' se responden 200 sin tocar la
        fila. "terminada sin audio" se registra como error.
        NO es una ruta para clientes: es el contrato con sunoapi.org.
        (evidencia: app/api/generate/callback/route.ts:45-116)
      security:
        - CallbackHmac: []
      parameters:
        - name: songId
          in: query
          required: true
          description: UUID de 36 caracteres de la canción.
          schema: { type: string, pattern: '^[0-9a-fA-F-]{36}$' }
        - name: sig
          in: query
          required: true
          description: HMAC-SHA256 hex (64) del songId con GENERATOR_CALLBACK_SECRET.
          schema: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
      requestBody:
        required: true
        description: >
          Payload del proveedor, sin esquema estable: el código acepta los
          campos status|state|taskStatus y audio_url|audioUrl|duration
          (readStatus/readAudio, líneas 23-43). Aquí se documenta lo que el
          código lee de verdad; el resto es opaque.
        content:
          application/json:
            schema:
              type: object
              x-no-verificado: true # El proveedor no publica esquema; estos son los campos que el handler consume.
              properties:
                status: { type: string, description: 'SUCCESS/complete/completed/succeeded/end/ready ⇒ ready; error/failed/fail ⇒ error; otro ⇒ pending (se ignora).' }
                audio_url: { type: string, format: uri, description: 'Debe empezar con http(s):// para aceptarse.' }
                duration: { type: number, description: 'Segundos; se descarta fuera de (0, 3600).' }
                errorMsg: { type: string }
            examples:
              done: { value: { status: 'SUCCESS', data: { audio_url: 'https://cdn.sunoapi.org/a.mp3', duration: 184 } } }
      responses:
        '200':
          description: Recibido. result es el string que devuelve la RPC (grabado|unknown|...).
          content:
            application/json:
              schema:
                type: object
                required: [received]
                properties:
                  received: { type: boolean, const: true }
                  ignored: { type: string, enum: [pending], description: 'Tarea viva; no se tocó la fila.' }
                  result: { type: string, description: 'Salida de apply_generation_result; "error" cuando el proveedor terminó sin audio.' }
              examples:
                ok: { value: { received: true, result: 'grabado' } }
                pending: { value: { received: true, ignored: pending } }
        '400':
          description: '{ error: "songId requerido." } | { error: "payload inválido." } (líneas 57-59, 67)'
          $ref: '#/components/responses/ErrorText'
        '401':
          $ref: '#/components/responses/ErrorText' # { error: 'firma inválida.' } — firma ausente, mal formada o secreto no configurado (línea 61)
        '500':
          $ref: '#/components/responses/ErrorText' # { error: 'no se pudo registrar el resultado.' } — fallo de RPC, deliberately para forzar reintento (línea 90)
        '503':
          description: 'error: "not_configured" — token de máquina, ÚNICO error no-narrativo del repo (línea 50).'
          content:
            application/json:
              schema:
                type: object
                required: [error, code]
                properties:
                  error: { type: string, description: 'Frase para humanos; el token de máquina viaja en code.' }
                  code: { type: string, const: not_configured }

  /api/songs/complete:
    post:
      operationId: complete_local_song
      tags: [generation, library]
      summary: Subida del audio renderizado por el motor local (multipart)
      description: |
        Cierra el ciclo del motor local: el navegador renderiza la receta de
        /api/generate y sube aquí el WAV/MP3 con su sesión (no service_role).
        Validaciones literales en app/api/songs/complete/route.ts: songId
        UUID, archivo presente y no vacío, ≤25 MB, MIME en la lista
        blanca, propiedad via RLS, engine debe ser 'local', estado no ready/error.
        Emite Cache-Control: private, no-store (la audioUrl es una firma de
        Storage de una sola cuenta). La respuesta informa storagePath y la
        firma con su expiración, pero NO repite la procedencia ni la cuota:
        sigue siendo la única ruta de generación que no devuelve cuánto cupo
        queda, laguna conocida y deliberadamente no cerrada aquí porque
        requeriría una lectura extra de entitlements en cada subida.
      security:
        - SupabaseSession: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [songId, audio]
              properties:
                songId: { type: string, pattern: '^[0-9a-fA-F-]{36}$' }
                audio:
                  type: string
                  format: binary
                  description: 'MIME admitido: audio/mpeg, audio/wav, audio/x-wav, audio/ogg, audio/mp4 (⇒ mp3/wav/ogg/m4a).'
                duration: { type: string, description: 'Segundos; Number() || null — no numérico se guarda como null sin error.' }
            examples:
              upload_wav: { value: { songId: '0f12ab34-5678-4c9d-be0f-1a2b3c4d5e6f', duration: '184' } }
      responses:
        '200':
          description: Audio guardado y canción marcada ready (salvo fallo parcial, ver 500).
          headers:
            Cache-Control: { schema: { type: string, const: 'private, no-store' } }
          content:
            application/json:
              schema:
                type: object
                required: [songId, storagePath, audioUrl, expiresAt]
                properties:
                  songId: { type: string, format: uuid }
                  storagePath: { type: string, description: '<userId>/<songId>.<ext>' }
                  audioUrl: { type: ['string', 'null'], format: uri, description: 'null si createSignedUrl falló.' }
                  expiresAt: { type: integer, description: 'epoch segundos (ahora+3600). ÚNICO formato unix de fechas del repo; el resto es ISO-8601.' }
        '400':
          $ref: '#/components/responses/ErrorText' # no-multipart / songId inválido / falta archivo / archivo vacío (líneas 55-66)
        '401':
          $ref: '#/components/responses/ErrorText' # 'Inicia sesión para guardar tu canción.' (línea 52)
        '404':
          $ref: '#/components/responses/ErrorText' # 'Esa canción no existe en tu biblioteca.' (línea 84)
        '409':
          $ref: '#/components/responses/ErrorText' # engine=provider (línea 88), ya guardada (91), o en estado error (94)
        '413':
          $ref: '#/components/responses/ErrorText' # 'El audio supera el límite de 25 MB.' (línea 68)
        '415':
          $ref: '#/components/responses/ErrorText' # 'Formato no admitido: <mime>.' (línea 73)
        '500':
          $ref: '#/components/responses/ErrorText' # subida OK pero mark_song_ready falló (líneas 127-133)
        '502':
          $ref: '#/components/responses/ErrorText' # Storage rechazó la subida (líneas 103-109)
        '503':
          $ref: '#/components/responses/ErrorText' # Supabase sin configurar (línea 47)

  /api/songs:
    get:
      operationId: list_songs
      tags: [library]
      summary: Lista paginada de canciones propias con URLs de audio firmadas
      description: |
        Requiere sesión. Paginación page/limit (máx 50 por página, page máx
        1000). Cada listing renueva las firmas de Storage (TTL 1h, confirmado
        también en el cuerpo como signedUrlsExpireIn).
        playableUrl = firma de storage_path si existe, si no audio_url del
        proveedor, si no null. Emite Cache-Control: private, no-store porque
        son URLs firmadas de una sola cuenta; intermediario que las cachee
        entregaría un enlace ajeno.
        (evidencia: app/api/songs/route.ts, PRIVATE_HEADERS)
      security:
        - SupabaseSession: []
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 1 } }
      responses:
        '200':
          description: Página de canciones.
          headers:
            Cache-Control: { schema: { type: string, const: 'private, no-store' } }
          content:
            application/json:
              schema:
                type: object
                required: [songs, page, perPage, signedUrlsExpireIn]
                x-no-verificado: true # No hay total ni cursor: sin COUNT, un agente no sabe si hay más página que la que devuelve.
                properties:
                  songs: { type: array, items: { $ref: '#/components/schemas/SongListItem' } }
                  page: { type: integer }
                  perPage: { type: integer }
                  signedUrlsExpireIn:
                    type: integer
                    description: Segundos de validez de las playableUrl de esta página (3600).
              examples:
                ok:
                  value:
                    songs:
                      - id: '0f12ab34-5678-4c9d-be0f-1a2b3c4d5e6f'
                        title: 'Lluvia en CDMX'
                        prompt: 'jazz nocturno'
                        genre: jazz
                        tempo: 88
                        engine: local
                        status: ready
                        audio_url: null
                        storage_path: 'd87f...-uuid/0f12ab34-....wav'
                        duration_seconds: 184
                        error: null
                        lesson_id: null
                        created_at: '2026-11-21T18:04:00.000Z'
                        playableUrl: 'https://xyz.supabase.co/storage/v1/object/sign/song-audio/...?token=...'
                    page: 1
                    perPage: 20
                    signedUrlsExpireIn: 3600
        '401':
          $ref: '#/components/responses/ErrorText' # (línea 38)
        '500':
          $ref: '#/components/responses/ErrorText' # 'No pudimos cargar tu biblioteca.' (línea 52)
        '503':
          $ref: '#/components/responses/ErrorText' # SUPABASE_NOT_CONFIGURED (línea 33)
    delete:
      operationId: delete_song
      tags: [library]
      summary: Borra una canción propia y su objeto de Storage
      description: |
        songId se acepta en cuerpo JSON ({songId}) o en query (?songId=); el
        cuerpo en DELETE es inusual para clientes HTTP genéricos (notar en
        auditoría). Primero se elimina el objeto de Storage, luego la fila.
        Si la fila de Storage no existía se ignora el error (huérfano tolerado,
        línea 107). (evidencia: app/api/songs/route.ts:85-117)
      security:
        - SupabaseSession: []
      parameters:
        - name: songId
          in: query
          required: false
          schema: { type: string, pattern: '^[0-9a-fA-F-]{36}$' }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                songId: { type: string, pattern: '^[0-9a-fA-F-]{36}$' }
            examples:
              by_body: { value: { songId: '0f12ab34-5678-4c9d-be0f-1a2b3c4d5e6f' } }
      responses:
        '200':
          description: Borrada.
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: string, format: uuid }
        '400':
          $ref: '#/components/responses/ErrorText' # 'Identificador de canción inválido.' (línea 99)
        '401':
          $ref: '#/components/responses/ErrorText' # (línea 92)
        '404':
          $ref: '#/components/responses/ErrorText' # 'Esa canción no está en tu biblioteca.' (línea 103)
        '500':
          $ref: '#/components/responses/ErrorText' # (línea 113)
        '503':
          $ref: '#/components/responses/ErrorText' # (línea 87)

  /api/entitlement:
    get:
      operationId: read_entitlement
      tags: [account]
      summary: Plan, cupo diario y contadores de quien llama (fuente de la cuota restante)
      description: |
        Una sola RPC security-definer read_entitlement() sin parámetros,
        filtrada por auth.uid() — no consultable para otra cuenta. Si no hay
        fila, se responde el plan gratuito explícito (FREE_TIER en
        lib/products.ts:147-159) para que la UI no adivine.
        El esquema de `entitlement` que devuelve la RPC NO está verificado en
        este repo (vive en una migración SQL); el fallback del handler fija las
        claves y tipos que se documentan. Emite Cache-Control: private,
        no-store: es el plan y el consumo de una cuenta.
        (evidencia: app/api/entitlement/route.ts)
      security:
        - SupabaseSession: []
      responses:
        '200':
          description: Estado de cuenta.
          headers:
            Cache-Control: { schema: { type: string, const: 'private, no-store' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntitlementReply' }
              x-no-verificado: true
              examples:
