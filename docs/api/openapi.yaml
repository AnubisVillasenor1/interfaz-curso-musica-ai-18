                  value:
                    entitlement:
                      plan: free
                      active: false
                      daily_limit: 0
                      used_today: 0
                      local_daily_limit: 10
                      local_used_today: 3
                      role: user
                      songs_total: 12
                      songs_ready: 11
                      lessons_done: 4
                    userId: 'd87f...'
                    email: 'alumna@correo.com'
        '401':
          $ref: '#/components/responses/ErrorText' # 'Inicia sesión para ver tu plan.' (línea 27)
        '500':
          $ref: '#/components/responses/ErrorText' # RPC falló (línea 33)
        '503':
          $ref: '#/components/responses/ErrorText' # (línea 22)

  /api/progress:
    get:
      operationId: read_course_progress
