        '500':
          $ref: '#/components/responses/ErrorText' # (línea 72)
        '503':
          $ref: '#/components/responses/ErrorText' # (línea 61)
    post:
      operationId: complete_lesson
      tags: [course]
      summary: Registra una lección completada (con lista blanca del catálogo)
      description: |
        lessonId debe existir en COURSE_LESSONS o se devuelve 400 sin tocar la
        BD (anti-inflado de insignias). El resto lo hace la RPC transaccional
        complete_lesson(): upsert, recuento e insignias. Los valores de badges
        (códigos) los define la BD, no este código: x-no-verificado.
        (evidencia: app/api/progress/route.ts:21-51)
      security:
