                  percent: { type: number }
                  badges:
                    type: array
                    items: { type: string }
                    x-no-verificado: true # Los códigos de insignia los emite complete_lesson() en SQL; este repo solo los tipa como string[].
              examples:
                ok: { value: { lessons_done: 5, lessons_total: 16, percent: 31, badges: ['primeras_notas'] } }
        '400':
          $ref: '#/components/responses/ErrorText' # 'Esa lección no existe en el programa.' (línea 34)
        '401':
          $ref: '#/components/responses/ErrorText' # (línea 28)
        '500':
          $ref: '#/components/responses/ErrorText' # RPC falló o respuesta con forma inesperada (41, 47 — mismo mensaje en ambos casos)
        '503':
          $ref: '#/components/responses/ErrorText' # (línea 23)

  /api/agent:
    post:
      operationId: chat_course_agent
      tags: [course]
      summary: Chat del curso; responde modelo real o guía determinista, rotulada
      description: |
        Pública (funciona sin sesión; la sesión solo eleva el techo de tasa y
        la ruta NUNCA exige sesión). Regla de honestidad cumplida: source
        'llm' implica proveedor real con `model`; sin clave o con fallo, la
        rama determinista responde con source 'fallback' y `note` explicando
        que el modelo no respondió — la interfaz nunca finge IA.
        Límite de tasa REAL implementado: por nodo en memoria, ventana 60s,
        6 req/min anónimo por IP, 20 req/min autenticado por userId
        (app/api/agent/route.ts). El 429 emite Retry-After, X-RateLimit-Limit
        y X-RateLimit-Remaining, y las respuestas de éxito con modelo emiten
        X-RateLimit-Limit/Remaining; al ser por instancia no es un cortafuegos
        global. El 429 conserva el shape de éxito (answer/source/lessonIds con
        rateLimited:true) porque la interfaz del chat lo lee, y añade además
        error + code 'rate_limited' + retryAfter para que un agente reintente
        sin adivinar.
      security: []
      x-rate-limit:
        window_ms: 60000
        anonymous_per_window: 6
        authenticated_per_window: 20
        scope: por instancia de función (en memoria), no global
      x-no-verificado: true # El techo efectivo global lo pone el panel del proveedor de IA, no este código.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, minLength: 1, maxLength: 2000 }
                history:
                  type: array
                  maxItems: 8 # trimHistory corta al último tramo; cada turno se recorta 2000 (user) / 4000 (assistant)
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role: { type: string, enum: [user, assistant] }
                      content: { type: string }
            examples:
              ask_price: { value: { message: '¿Cuánto cuesta el curso?', history: [] } }
      responses:
        '200':
          description: Respuesta del agente o de la guía determinista.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentReply' }
              examples:
                llm: { value: { answer: 'El curso cuesta...', source: llm, model: 'gpt-4o-mini', lessonIds: [] } }
                fallback: { value: { answer: 'Los precios reales del catálogo son...', source: fallback, lessonIds: [] } }
        '400':
          $ref: '#/components/responses/ErrorText' # 'Escribe una pregunta.' (línea 132)
        '413':
          $ref: '#/components/responses/ErrorText' # 'Tu mensaje es demasiado largo.' >2000 chars (línea 134)
        '429':
          description: Techo de la ventana alcanzado. Mantiene el shape de AgentReply (rateLimited:true) por contrato con la UI y añade error + code + retryAfter. Con cabeceras de reintento.
          headers:
            Retry-After:
              schema: { type: string }
              description: Segundos hasta la ventana siguiente; lo calcula rateCheck() y viaja también en el cuerpo como retryAfter.
            X-RateLimit-Limit: { schema: { type: string }, description: '6 anónimo, 20 autenticado, por ventana de 60 s.' }
            X-RateLimit-Remaining: { schema: { type: string, const: '0' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentReply' }
              examples:
                limited:
                  value:
                    answer: 'Varios mensajes seguidos desde el mismo sitio: espera un minuto y vuelve a preguntar.'
                    source: fallback
                    lessonIds: []
                    rateLimited: true
                    error: 'Demasiadas preguntas seguidas. Espera antes de volver a intentar.'
                    code: rate_limited
                    retryAfter: 47

  /api/auth/logout:
    post:
      operationId: logout_session
      tags: [account]
      summary: Cierra la sesión Supabase y redirige a la home
      description: |
        No valida sesión: POST sin cookie activa simplemente limpia y redirige.
        Destino localhost directo; en producción usa NEXT_PUBLIC_APP_URL (o
        fallback de Vercel). Sin CSRF explícito en la ruta.
        (evidencia: app/api/auth/logout/route.ts:16-28)
      security: []
      responses:
        '302':
          description: Redirección a la página principal.
          headers:
            Location:
              schema: { type: string, format: uri }
          content:
            application/json:
              schema: { type: object } # cuerpo vacío del redirect
        '503':
          $ref: '#/components/responses/ErrorText' # SUPABASE_NOT_CONFIGURED (línea 18)

components:
  securitySchemes:
    SupabaseSession:
      type: apiKey
      in: cookie
      name: sb-*-auth-token (cookies emitidas por @supabase/ssr)
      description: |
        Sesión de usuario verificada en el servidor con supabase.auth.getUser()
        en cada handler autenticado. No existe token Bearer: una herramienta
        externa sin navegador no puede autenticarse salvo replicando las
        cookies del flujo de Supabase. Las rutas 503 "no configurado" se
        devuelven ANTES de la comprobación de sesión.
    CallbackHmac:
      type: apiKey
      in: query
      name: sig
      description: |
        HMAC-SHA256 (hex, 64) del songId con el secreto de servidor
        GENERATOR_CALLBACK_SECRET; lo genera signCallbackUrl() en /api/generate
        y lo verifica verifyCallbackSignature() en el callback con
        comparación time-safe. Sin secreto configurado, todo callback se
        rechaza con 401.
      x-no-verificado: true # El proveedor externo (sunoapi.org) no firma; esta firma es de la app hacia sí misma vía el proveedor.

  schemas:
    ErrorResponse:
      type: object
      description: |
        Esquema de error común REAL del repo: { error, code } con mensaje
        legible en español y un código estable de máquina. El campo `code` se
        añadió tras la auditoría de agent-readiness (fallos E2/E3): antes no
        existía en ningún endpoint salvo el token 'not_configured' del
        callback, y eso obligaba a un agente a parear frases. `code` es ahora
        obligatorio en los errores de las 12 rutas; una herramienta debe
        ramificar por `code` y tratar `error` como texto para humanos.
      required: [error, code]
      properties:
        error:
          type: string
          description: Mensaje para humanos en español; puede cambiar de redacción sin avisar, el contrato es `code`.
        code:
          type: string
          description: Token estable. Lista completa emitida por el código (no teórica).
          enum:
            - unauthorized # 401: sin sesión de Supabase
            - invalid_request # 400: cuerpo o parámetros mal formados
            - unknown_lesson # 400: lessonId fuera de lib/course.ts
            - query_too_short # 400: /api/music/search con q < 2
            - query_too_long # 400: /api/music/search con q > 100
            - prompt_too_long # 413: /api/music/compose con prompt > 1200
            - message_too_long # 413: /api/agent con mensaje > 2000
            - missing_audio # 400: /api/songs/complete sin campo audio
            - empty_audio # 400: audio de 0 bytes
            - audio_too_large # 413: audio > 25 MB (ver limit)
            - unsupported_media_type # 415: MIME fuera de ALLOWED_TYPES (ver allowed)
            - engine_mismatch # 409: la canción es del estudio con voces
            - already_ready # 409: la canción ya está guardada
            - needs_recreate # 409: la fila quedó en 'error'
            - not_found # 404: id válido pero ajeno a la biblioteca
            - quota_exceeded # 402: sin cupo (ver limit/used)
            - quota_unavailable # 500: la RPC de cupo no respondió
            - rate_limited # 429: ventana de tasa del chat (ver retryAfter)
            - storage_error # 500/502: fallo de Supabase Storage
            - read_failed # 500: lectura de datos propia
            - write_failed # 500: escritura de progreso
            - update_failed # 500/502: no se pudo marcar el resultado
            - delete_failed # 500: borrado rechazado
            - provider_unreachable # 502: Stripe o el proveedor musical
            - upstream_unavailable # 502: ambos catálogos de búsqueda
            - signature_invalid # 401: callback sin HMAC válido
            - not_configured # 503: credenciales/variables ausentes en el entorno
        available:
          type: array
          items: { $ref: '#/components/schemas/ProductId' }
          description: 'Solo en 400 de /api/checkout: productos válidos, útil para auto-corregirse.'
        allowed:
          type: array
          items: { type: string }
          description: 'Solo en 415 de /api/songs/complete: MIME admitidos por el bucket.'
        limit:
          type: integer
          description: 'Solo en 402 de /api/generate (cupo total del plan), 413 de /api/agent y 413 de /api/songs/complete (bytes).'
        used: { type: integer, description: 'Solo en 402 de /api/generate: cupo usado hoy.' }
        retryAfter:
          type: integer
          description: 'Solo en 429 de /api/agent: segundos hasta la siguiente ventana; viaja duplicado en la cabecera Retry-After.'
        fallback:
          type: string
          enum: [local]
          description: "Solo en 503 de /api/generate (engine=provider): sugiere reintentar con motor local."

    ProductId:
      type: string
      enum: [play-and-go-course, play-and-go-extension, play-and-go-pro]
      description: 'Lista blanca estricta de lib/products.ts:55-99 (findProduct, 108-112).'

    SongStatus:
      type: string
      enum: [queued, generating, ready, error]
      description: 'Valados observados en generate/complete/callback. apply_generation_result (SQL) fija ready/error; x-no-verificado: la BD podría admitir otros.'

    Song:
      type: object
      description: 'Proyección de generate al crear: select id,title,status,created_at,engine (route.ts:111).'
      required: [id, title, status, created_at, engine]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, maxLength: 80 }
        status: { $ref: '#/components/schemas/SongStatus' }
        created_at: { type: string, format: date-time }
        engine: { type: string, enum: [local, provider], description: 'PROCEDENCIA: siempre presente.' }

    LocalRenderReply:
      type: object
      description: 'engine=local: el servidor devuelve receta, el navegador renderiza (app/api/generate/route.ts).'
      required: [song, render, message, quota]
      properties:
        song: { $ref: '#/components/schemas/Song' }
        render:
          type: object
          required: [engine, prompt, title]
          properties:
            engine: { type: string, const: local }
            prompt: { type: string }
            seed: { type: string, description: 'play-and-go-local-v1:<songId> — determinista por id.' }
            genreId: { type: string, maxLength: 40 }
            bpm: { type: integer, minimum: 40, maximum: 200 }
            title: { type: string }
        message: { type: string }
        quota: { $ref: '#/components/schemas/QuotaRemaining' }

    ProviderQueuedReply:
      type: object
      required: [song, taskId, quota]
      properties:
        song: { $ref: '#/components/schemas/Song' }
        taskId: { type: string, description: 'Id de tarea del proveedor; el progreso real se consulta por /api/songs (polling), no hay endpoint de estado dedicado ni 202.' }
        quota: { $ref: '#/components/schemas/QuotaRemaining' }

    QuotaRemaining:
      type: object
      description: |
        Cupo del plan tras descontar la generación que se acaba de aceptar.
        Se añade en la respuesta de éxito para que un agente no tenga que
        llamar a /api/entitlement para saber cuánto le queda. Es la vista de
        la RPC consume_generation_quota, por motor: limit_total el techo y
        limit_used lo consumido en la ventana.
      required: [limit, used]
      properties:
        limit: { type: integer, minimum: 0 }
        used: { type: integer, minimum: 0 }
      examples:
        after_one: { value: { limit: 10, used: 1 } }

    SongListItem:
      type: object
      description: 'Camel/snake mezclado: las columnas llegan en snake_case de Supabase y solo playableUrl es camel (route.ts:69-72).'
      required: [id, title, status, engine, created_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        prompt: { type: string }
        genre: { type: ['string', 'null'] }
        tempo: { type: ['integer', 'null'] }
        engine: { type: string, enum: [local, provider] }
        status: { $ref: '#/components/schemas/SongStatus' }
        audio_url: { type: ['string', 'null'], format: uri, description: 'URL del proveedor (CDN, caduca); null en motor local.' }
        storage_path: { type: ['string', 'null'] }
        duration_seconds: { type: ['number', 'null'] }
        error: { type: ['string', 'null'], description: 'Texto de error de proveedor guardado en la fila; puede exponer frases internas como "Proveedor musical no configurado."' }
        lesson_id: { type: ['string', 'null'] }
        created_at: { type: string, format: date-time }
        playableUrl: { type: ['string', 'null'], format: uri, description: 'Firma de Storage (TTL 1h) o audio_url de respaldo.' }

    SearchResults:
      type: object
      required: [results, providers, notice]
      properties:
        results:
          type: array
          maxItems: 24
          items:
            type: object
            required: [id, title, creator, source, url]
            properties:
              id: { type: string, description: 'Prefijado por origen: "ia-<identifier>" | "jamendo-<id>". Formato de id distinto al UUID del resto de la API (documentado en N4/P4 del informe).' }
              title: { type: string }
              creator: { type: string }
              source: { type: string, enum: [Internet Archive, Jamendo] }
              license: { type: string, description: 'URL o frase advirtiendo de consultar la licencia.' }
              url: { type: string, format: uri }
        providers:
          type: object
          description: 'Disponibilidad real de cada catálogo en ESTA llamada; false ⇒ se degradó en silencio (solo 502 si ambos fallan).'
          required: [internetArchive, jamendo]
          properties:
            internetArchive: { type: boolean }
            jamendo: { type: boolean, description: 'Falso si JAMENDO_CLIENT_ID no está o si la llamada falló; no distinguibles.' }
        notice: { type: string }

    EntitlementReply:
      type: object
      required: [entitlement, userId, email]
      properties:
        entitlement:
          type: object
          x-no-verificado: true # read_entitlement() vive en una migración SQL; esta forma es la del fallback FREE_TIER del handler (route.ts:40-51).
          required: [plan, active, daily_limit, used_today, local_daily_limit, local_used_today, role, songs_total, songs_ready, lessons_done]
          properties:
            plan: { type: string, enum: [free, enrolled, extension, pro], description: 'Valores de grant.plan en lib/products.ts; x-no-verificado para el valor devuelto por la RPC.' }
            active: { type: boolean }
            daily_limit: { type: integer, description: 'Cupo diario con proveedor (pagado).' }
            used_today: { type: integer }
            local_daily_limit: { type: integer, description: 'Cupo diario motor local (gratis: 10).' }
            local_used_today: { type: integer }
            role: { type: string, description: 'user u otro rol definido en SQL (x-no-verificado).' }
            songs_total: { type: integer }
            songs_ready: { type: integer }
            lessons_done: { type: integer }
        userId: { type: string, format: uuid }
        email: { type: ['string', 'null'], format: email }

    AgentReply:
      type: object
      description: 'Contrato de honestidad: source indica quién respondió.'
      required: [answer, source, lessonIds]
      properties:
        answer: { type: string, maxLength: 4000 }
        source:
          type: string
          enum: [llm, fallback]
          description: "'llm' ⇒ proveedor real con `model`; 'fallback' ⇒ guía determinista del repo. Nunca se etiqueta determinista como IA."
        model: { type: string, description: 'Presente solo con source=llm (nombre del modelo del proveedor).' }
        lessonIds: { type: array, items: { type: string }, description: 'Lecciones que sustentan la respuesta; vacío si ninguna.' }
        note: { type: string, description: 'Presente solo en fallback con proveedor configurado: "El modelo no respondió; te contesto con el contenido del curso."' }
        rateLimited: { type: boolean, const: true, description: 'Solo en 429.' }

  responses:
