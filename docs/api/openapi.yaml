      summary: Lecciones completadas e insignias del usuario
      description: |
        Lee lesson_progress y badges bajo RLS. Ojo: el fallo de la lectura de
        badges se ignora silenciosamente (sin comprobación de error). Mezcla
        casing: lessonId/earnedAt camelCase pero el resto snake en otras rutas.
        Emite Cache-Control: private, no-store.
        (evidencia: app/api/progress/route.ts)
      security:
        - SupabaseSession: []
      responses:
        '200':
          description: Ruta del curso.
          headers:
            Cache-Control: { schema: { type: string, const: 'private, no-store' } }
          content:
            application/json:
              schema:
                type: object
                required: [completed, badges, total]
                properties:
                  completed:
                    type: array
                    items:
                      type: object
                      properties:
                        lessonId: { type: string, pattern: '^m0[1-5]-l0[1-9]$|^m0[1-5]-l1[0-6]$' }
                        at: { type: ['string', 'null'], format: date-time }
                  badges:
                    type: array
